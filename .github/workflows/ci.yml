name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ cmake make git python3 libsqlite3-dev

      - name: Toolchain setup (pinned Goose)
        run: python3 honk.py setup

      - name: Full test suite (Release + ASan/UBSan/LSan)
        run: python3 honk.py test
